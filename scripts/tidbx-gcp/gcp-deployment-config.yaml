  - name: nextgen-s3-minio
    properties:
      disks:
        - autoDelete: true
          boot: true
          deviceName: boot
          initializeParams:
            sourceImage: https://www.googleapis.com/compute/v1/projects/rocky-linux-cloud/global/images/rocky-linux-9-optimized-gcp-v20241112
          type: PERSISTENT
        - autoDelete: true
          deviceName: nextgen-s3-data-minio
          source: $(ref.nextgen-s3-data-minio.selfLink)
          type: PERSISTENT
      machineType: https://www.googleapis.com/compute/v1/projects/gcp-tikv-transaction-dev/zones/us-east5-b/machineTypes/n2-custom-4-8192
      metadata:
        items:
          - key: startup-script
            value: |
              function install-commons() {
                  dnf install -y --setopt=install_weak_deps=false epel-release
                  dnf install -y --setopt=install_weak_deps=false git tig lnav tmux rsync numactl mysql bash-completion curl wget
              }

              function install-minio() {
                  wget https://dl.min.io/server/minio/release/linux-amd64/minio -O /usr/local/bin/minio
                  chmod +x /usr/local/bin/minio

                  useradd -r minio-user -s /sbin/nologin
                  mkdir -p /etc/minio
                  mkdir -p /var/log/minio
                  chown minio-user:minio-user /var/log/minio
              }

              function setup-minio-service() {
                  cat > /etc/systemd/system/minio.service << 'MINIO_SERVICE_END'
              [Unit]
              Description=MinIO Object Storage
              Documentation=https://docs.min.io
              Wants=network-online.target
              After=network-online.target
              AssertFileIsExecutable=/usr/local/bin/minio

              [Service]
              WorkingDirectory=/usr/local/
              User=minio-user
              Group=minio-user
              EnvironmentFile=/etc/minio/minio.conf
              ExecStartPre=/bin/chown -R minio-user:minio-user /data
              ExecStart=/usr/local/bin/minio server --console-address ":9001" /data/minio
              Restart=always
              StandardOutput=journal
              StandardError=inherit
              SyslogIdentifier=minio
              KillSignal=SIGTERM
              SendSIGKILL=no
              SuccessExitStatus=0
              LimitNOFILE=1048576
              LimitNPROC=1048576

              [Install]
              WantedBy=multi-user.target
              MINIO_SERVICE_END

                  cat > /etc/minio/minio.conf << 'EOF'
              MINIO_ROOT_USER=minioadmin
              MINIO_ROOT_PASSWORD=minioadmin
              MINIO_VOLUMES="/data/minio"
              MINIO_OPTS="--console-address :9001"
              EOF
                  chmod 640 /etc/minio/minio.conf
              }

              function mount-disk() {
                  local disk=${1:-/dev/sdb}
                  local mount_point=${2:-/data}
                  mkdir -p $mount_point
                  mkfs.ext4 -m 0 -E lazy_itable_init=0,lazy_journal_init=0,discard $disk
                  echo "$(blkid -o export $disk | grep UUID) $mount_point ext4 discard,defaults,noatime 0 2" | tee -a /etc/fstab
                  systemctl daemon-reload
                  mount $disk

                  mkdir -p /data/minio
                  chown -R minio-user:minio-user /data
              }

              set -x
              install-commons
              install-minio
              mount-disk $([[ $(mount | grep 'on / type') == /dev/sda* ]] && echo /dev/sdb || echo /dev/sda)
              setup-minio-service
              systemctl daemon-reload
              systemctl enable minio
              systemctl start minio
      networkInterfaces:
        - accessConfigs:
            - name: External NAT
              type: ONE_TO_ONE_NAT
          network: https://www.googleapis.com/compute/v1/projects/gcp-tikv-transaction-dev/global/networks/default
      serviceAccounts:
        - email: benchmark@gcp-tikv-transaction-dev.iam.gserviceaccount.com
          scopes:
            - https://www.googleapis.com/auth/cloud-platform
      tags:
        items:
          - minio-server
      zone: us-east5-b
    type: compute.v1.instance


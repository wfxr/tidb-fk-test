# Required at runtime. Leave blank in VCS and provide via an override file.
dsn: ""

# Fixed worker-group defaults. The current scheduler derives the live worker
# total from the three group counts below.
total_workers: 8
generic_workers: 4
propertyme_workers: 3
failure_probe_workers: 1

# Reserved for the future scenario-mix loop. These weights are configured and
# documented now, but the current CLI does not consume them yet.
generic_weight: 60
propertyme_weight: 35
failure_probe_weight: 5

# Logged by the startup skeleton as the intended phase timings.
warmup_duration: 15m
post_upgrade_duration: 20m

# Timing knobs already wired into config loading. The progress snapshot cadence
# default is 10s; today the CLI logs the interval and builds one initial warmup
# snapshot, but it does not yet emit a recurring 10-second ticker.
failure_probe_interval: 10s
progress_report_interval: 10s
scenario_timeout: 30s
max_retry: 0

# Seed-plan sizing used by the current generic and PropertyMe fixture planners.
seed_parent_rows_per_table: 1000
seed_hot_parent_keys: 16

# Enabled by default for the intended full workflow. For startup smoke checks on
# a plain test database, use an override file with checker_enabled: false
# because placeholder seeding does not create the checker tables yet.
checker_enabled: true
